<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Каркассон</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #0b0e14; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; padding: 10px; overflow: hidden; }

        #version-label { font-size: 12px; color: #f1c40f; margin-bottom: 5px; font-weight: bold; }

        #carcassonne-screen { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 600px; }

        .player-panel {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: #1e2633;
            border-radius: 10px;
            margin: 5px 0;
            border: 2px solid transparent;
            font-size: 16px;
            font-weight: bold;
        }
        .player-panel.active { border-color: #f1c40f; box-shadow: 0 0 10px rgba(241, 196, 15, 0.3); }

        .blue-name { color: #00f2fe; }
        .red-name { color: #ff007f; }

        #controls-top { display: flex; flex-direction: column; align-items: center; width: 100%; margin: 10px 0; }

        #tile-preview {
            width: 90px; height: 90px;
            background: #1e2633;
            border: 3px solid #f1c40f;
            margin-bottom: 10px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
        }
        #tile-preview img { width: 100%; height: 100%; object-fit: cover; }

        .btn-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .btn { padding: 10px 15px; background: #4facfe; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn:active { transform: scale(0.95); }
        .btn-green { background: #2ecc71; }
        .btn-orange { background: #e67e22; }
        .btn-purple { background: #9b59b6; }
        .btn-red { background: #e74c3c; display: none; }
        .btn-end { background: #c0392b; margin-top: 15px; }

        #status-text { margin: 10px 0; font-size: 16px; color: #c9d1d9; text-align: center; min-height: 24px; }

        #board-wrapper {
            width: 100%;
            height: 400px;
            overflow: hidden;
            background: #0f131a;
            border-radius: 10px;
            border: 1px solid #1e2633;
            position: relative;
            touch-action: none;
            cursor: grab;
        }
        #board-wrapper:active { cursor: grabbing; }

        #carcassonne-board {
            display: grid;
            grid-template-columns: repeat(15, 40px);
            grid-template-rows: repeat(15, 40px);
            gap: 1px;
            background: #1e2633;
            padding: 5px;
            border-radius: 8px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            transform-origin: center;
            transition: transform 0.05s linear;
        }

        .car-cell {
            width: 40px; height: 40px;
            background: #131821;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            position: relative;
        }
        .car-cell.center-highlight { background: rgba(46, 204, 113, 0.15); border: 1px solid rgba(46, 204, 113, 0.3); }

        .tile-img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }

        .meeple {
            width: 16px; height: 16px;
            border-radius: 50%;
            position: absolute;
            border: 2px solid white;
            z-index: 10;
            pointer-events: none;
        }
        .meeple.red { background: #ff007f; }
        .meeple.blue { background: #00f2fe; }

        #meeple-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }
        #meeple-modal h3 { color: #f1c40f; margin-bottom: 15px; font-size: 20px; text-align: center; }

        #meeple-tile-container {
            position: relative;
            width: 280px; height: 280px;
            border: 3px solid #f1c40f;
            border-radius: 12px;
            overflow: hidden;
            background: #1e2633;
        }
        #meeple-tile-container img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }

        .meeple-zone {
            position: absolute;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: rgba(255,255,255,0.7);
        }
        .meeple-zone:hover { background: rgba(46, 204, 113, 0.5); color: white; }

        .zone-top { top: 0; left: 0; width: 100%; height: 35%; }
        .zone-bottom { bottom: 0; left: 0; width: 100%; height: 35%; }
        .zone-left { top: 35%; left: 0; width: 35%; height: 30%; }
        .zone-right { top: 35%; right: 0; width: 35%; height: 30%; }
        .zone-center { top: 40%; left: 40%; width: 20%; height: 20%; border-radius: 50%; background: rgba(255, 255, 255, 0.1); }

        #meeple-modal button {
            margin-top: 20px;
            padding: 12px 30px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        #final-score-screen {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(11, 14, 20, 0.98);
            z-index: 3000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        #final-score-screen h2 { color: #f1c40f; margin-bottom: 20px; font-size: 24px; }
        #final-score-screen .score-line { font-size: 22px; margin: 10px 0; }
        #final-score-screen button {
            padding: 15px 30px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>

        };

        const VALID_TILES = Object.keys(TILE_DATA).map(Number);

        let carBoardData = [];
        let currentTileIndex = null;
        let currentRotation = 0;
        let currentPlayer = 'blue';

        let blueMeeples = 7;
        let redMeeples = 7;
        let bluePoints = 0;
        let redPoints = 0;

        let lastPlacedR = -1;
        let lastPlacedC = -1;

        let scale = 1;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let dragMoved = false;
        let startX = 0, startY = 0;
        let initialPinchDistance = null;

        const carBoardElement = document.getElementById('carcassonne-board');
        const wrapper = document.getElementById('board-wrapper');

        // ==========================================
        // DSU (Union-Find) для объектов
        // ==========================================
        class DSU {
            constructor() { this.parent = {}; }
            find(x) {
                if (this.parent[x] === undefined) this.parent[x] = x;
                if (this.parent[x] !== x) this.parent[x] = this.find(this.parent[x]);
                return this.parent[x];
            }
            union(a, b) {
                const ra = this.find(a), rb = this.find(b);
                if (ra !== rb) this.parent[ra] = rb;
            }
        }

        const dsu = new DSU();
        let allSegments = new Set();

        const OPPOSITE = { top: 'bottom', bottom: 'top', left: 'right', right: 'left' };
        const DIR = { top: [-1, 0], bottom: [1, 0], left: [0, -1], right: [0, 1] };

        function segKey(r, c, side) { return `${r},${c},${side}`; }

        // ==========================================
        // ИНИЦИАЛИЗАЦИЯ
        // ==========================================
        function initCarcassonne() {
            carBoardElement.innerHTML = '';
            carBoardData = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));

            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'car-cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.addEventListener('click', (e) => {
                        if (dragMoved) return;
                        onCarCellClick(r, c);
                    });
                    carBoardElement.appendChild(cell);
                }
            }

            const center = Math.floor(BOARD_SIZE / 2);
            const centerCell = document.querySelector(`.car-cell[data-row="${center}"][data-col="${center}"]`);
            if (centerCell) centerCell.classList.add('center-highlight');

            updateUI();
            updateBoardTransform();
            addPanListeners();
            addPinchListeners();
            document.getElementById('status-text').innerText = "Игра началась! Ход Синих.";
        }

        function updateUI() {
            document.getElementById('player1-meeples').innerText = `🧙‍♂️ ${blueMeeples}`;
            document.getElementById('player2-meeples').innerText = `🧙‍♂️ ${redMeeples}`;
            document.getElementById('player1-score').innerText = bluePoints;
            document.getElementById('player2-score').innerText = redPoints;

            const p1Panel = document.getElementById('player1-panel');
            const p2Panel = document.getElementById('player2-panel');

            if (currentPlayer === 'blue') {
                p1Panel.classList.add('active');
                p2Panel.classList.remove('active');
                document.getElementById('btn-meeple').style.display = blueMeeples > 0 ? 'block' : 'none';
            } else {
                p2Panel.classList.add('active');
                p1Panel.classList.remove('active');
                document.getElementById('btn-meeple').style.display = redMeeples > 0 ? 'block' : 'none';
            }
        }

        // ==========================================
        // ПЕРЕМЕЩЕНИЕ / ЗУМ КАРТЫ
        // ==========================================
        function updateBoardTransform() {
            carBoardElement.style.transform =
                `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${scale})`;
        }

        function addPanListeners() {
            wrapper.addEventListener('mousedown', (e) => {
                isDragging = true;
                dragMoved = false;
                startX = e.clientX - panX;
                startY = e.clientY - panY;
            });

            wrapper.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const newPanX = e.clientX - startX;
                const newPanY = e.clientY - startY;
                if (Math.abs(newPanX - panX) > 3 || Math.abs(newPanY - panY) > 3) dragMoved = true;
                panX = newPanX;
                panY = newPanY;
                updateBoardTransform();
            });

            wrapper.addEventListener('mouseup', () => { isDragging = false; });
            wrapper.addEventListener('mouseleave', () => { isDragging = false; });

            wrapper.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    dragMoved = false;
                    startX = e.touches[0].clientX - panX;
                    startY = e.touches[0].clientY - panY;
                }
            }, { passive: true });

            wrapper.addEventListener('touchmove', (e) => {
                if (isDragging && e.touches.length === 1) {
                    e.preventDefault();
                    const newPanX = e.touches[0].clientX - startX;
                    const newPanY = e.touches[0].clientY - startY;
                    if (Math.abs(newPanX - panX) > 3 || Math.abs(newPanY - panY) > 3) dragMoved = true;
                    panX = newPanX;
                    panY = newPanY;
                    updateBoardTransform();
                }
            }, { passive: false });

            wrapper.addEventListener('touchend', () => { isDragging = false; });
        }

        function addPinchListeners() {
            wrapper.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    initialPinchDistance = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                }
            }, { passive: true });

            wrapper.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2 && initialPinchDistance) {
                    e.preventDefault();
                    const currentDistance = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    const factor = currentDistance / initialPinchDistance;
                    scale *= factor;
                    if (scale < 0.5) scale = 0.5;
                    if (scale > 5) scale = 5;
                    initialPinchDistance = currentDistance;
                    updateBoardTransform();
                }
            }, { passive: false });

            wrapper.addEventListener('touchend', (e) => {
                if (e.touches.length < 2) initialPinchDistance = null;
            });
        }

        // ==========================================
        // ИГРОВАЯ ЛОГИКА — ТАЙЛЫ
        // ==========================================
        function drawTile() {
            if (currentTileIndex !== null) {
                document.getElementById('status-text').innerText = "Сначала поставьте текущий тайл!";
                return;
            }
            currentTileIndex = VALID_TILES[Math.floor(Math.random() * VALID_TILES.length)];
            currentRotation = 0;
            updatePreview();
            checkIfTileCanBePlaced();
        }

        function checkIfTileCanBePlaced() {
            if (currentTileIndex === null) return;

            let canPlace = false;
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (carBoardData[r][c] !== null) continue;
                    for (let rot = 0; rot < 360; rot += 90) {
                        if (isValidPlacement(r, c, currentTileIndex, rot)) { canPlace = true; break; }
                    }
                    if (canPlace) break;
                }
                if (canPlace) break;
            }

            document.getElementById('btn-replace').style.display = canPlace ? 'none' : 'block';
            if (!canPlace) {
                document.getElementById('status-text').innerText = "Этот тайл никуда не подходит! Нажмите 'Поменять'.";
            } else {
                document.getElementById('status-text').innerText = `Вытянут тайл #${currentTileIndex}.`;
            }
        }

        function getRotatedSides(tile, rotation) {
            let sides = { ...tile };
            if (rotation === 90) {
                sides = { top: tile.left, right: tile.top, bottom: tile.right, left: tile.bottom };
            } else if (rotation === 180) {
                sides = { top: tile.bottom, right: tile.left, bottom: tile.top, left: tile.right };
            } else if (rotation === 270) {
                sides = { top: tile.right, right: tile.bottom, bottom: tile.left, left: tile.top };
            }
            return sides;
        }

        function isValidPlacement(r, c, tileIndex, rotation) {
            const tileData = TILE_DATA[tileIndex];
            if (!tileData) return false;

            const isFirstMove = carBoardData.flat().every(cell => cell === null);
            if (isFirstMove) {
                const center = Math.floor(BOARD_SIZE / 2);
                return r === center && c === center;
            }

            const rotatedSides = getRotatedSides(tileData, rotation);
            let hasNeighbor = false;
            const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];

            for (let [dr, dc] of dirs) {
                let nr = r + dr, nc = c + dc;
                if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE) continue;
                if (carBoardData[nr][nc] === null) continue;

                hasNeighbor = true;
                const neighborData = carBoardData[nr][nc];
                const neighborTile = TILE_DATA[neighborData.imgIndex];
                if (!neighborTile) continue;
                const neighborSides = getRotatedSides(neighborTile, neighborData.rotation);

                let currentSide, neighborSide;
                if (dr === -1) { currentSide = 'top'; neighborSide = 'bottom'; }
                if (dr === 1) { currentSide = 'bottom'; neighborSide = 'top'; }
                if (dc === -1) { currentSide = 'left'; neighborSide = 'right'; }
                if (dc === 1) { currentSide = 'right'; neighborSide = 'left'; }

                if (rotatedSides[currentSide] !== neighborSides[neighborSide]) return false;
            }
            return hasNeighbor;
        }

        function rotateTile() {
            if (currentTileIndex === null) return;
            currentRotation = (currentRotation + 90) % 360;
            updatePreview();
            checkIfTileCanBePlaced();
        }

        function replaceTile() {
            if (currentTileIndex === null) return;
            currentTileIndex = null;
            currentRotation = 0;
            updatePreview();
            document.getElementById('btn-replace').style.display = 'none';
            document.getElementById('status-text').innerText = "Тайл сброшен. Возьмите новый.";
            drawTile();
        }

        function updatePreview() {
            const preview = document.getElementById('tile-preview');
            if (currentTileIndex === null) { preview.innerHTML = ''; return; }
            const img = document.createElement('img');
            img.src = `${TILE_FOLDER}tile_${currentTileIndex}${FILE_EXTENSION}`;
            img.style.transform = `rotate(${currentRotation}deg)`;
            preview.innerHTML = '';
            preview.appendChild(img);
        }

        function onCarCellClick(r, c) {
            if (currentTileIndex === null) return;
            if (carBoardData[r][c] !== null) return;

            if (!isValidPlacement(r, c, currentTileIndex, currentRotation)) {
                document.getElementById('status-text').innerText = "Нельзя ставить здесь!";
                return;
            }

            carBoardData[r][c] = {
                imgIndex: currentTileIndex,
                rotation: currentRotation,
                meeple: null
            };

            lastPlacedR = r;
            lastPlacedC = c;

            registerTileSegments(r, c);
            renderCarBoard();
            updateScoresAfterPlacement(r, c);

            currentTileIndex = null;
            currentRotation = 0;
            updatePreview();
            document.getElementById('btn-replace').style.display = 'none';

            document.getElementById('status-text').innerText =
                `Тайл установлен! Ход ${currentPlayer === 'blue' ? 'Синих' : 'Красных'}.`;
        }

        // ==========================================
        // DSU: РЕГИСТРАЦИЯ СЕГМЕНТОВ
        // ==========================================
        function registerTileSegments(r, c) {
            const tile = carBoardData[r][c];
            const sides = getRotatedSides(TILE_DATA[tile.imgIndex], tile.rotation);

            tile.segments = tile.segments || {};
            for (const side of ['top', 'bottom', 'left', 'right']) {
                const type = sides[side];
                if (type === 'R' || type === 'C') {
                    const key = segKey(r, c, side);
                    dsu.find(key);
                    allSegments.add(key);
                    tile.segments[side] = type;
                }
            }

            for (const side of ['top', 'bottom', 'left', 'right']) {
                const type = sides[side];
                if (type !== 'R' && type !== 'C') continue;
                const [dr, dc] = DIR[side];
                const nr = r + dr, nc = c + dc;
                if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE) continue;
                const neighbor = carBoardData[nr][nc];
                if (!neighbor) continue;
                const nSides = getRotatedSides(TILE_DATA[neighbor.imgIndex], neighbor.rotation);
                if (nSides[OPPOSITE[side]] === type) {
                    dsu.union(segKey(r, c, side), segKey(nr, nc, OPPOSITE[side]));
                }
            }
        }

        // Собрать сегменты объекта по корню и ТИПУ
        function getObjectSegments(root, type) {
            const result = [];
            for (const seg of allSegments) {
                if (dsu.find(seg) !== root) continue;
                const parts = seg.split(',');
                const rr = parseInt(parts[0]), cc = parseInt(parts[1]), side = parts[2];
                const tile = carBoardData[rr][cc];
                if (!tile) continue;
                const sides = getRotatedSides(TILE_DATA[tile.imgIndex], tile.rotation);
                if (sides[side] === type) result.push(seg);
            }
            return result;
        }

        // Завершённость объекта (по его сегментам и типу)
        function isObjectComplete(segments, type) {
            for (const seg of segments) {
                const parts = seg.split(',');
                const rr = parseInt(parts[0]), cc = parseInt(parts[1]), side = parts[2];
                const tile = carBoardData[rr][cc];
                if (!tile) return false;

                const [dr, dc] = DIR[side];
                const nr = rr + dr, nc = cc + dc;
                if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE) return false;
                const neighbor = carBoardData[nr][nc];
                if (!neighbor) return false;

                const nSides = getRotatedSides(TILE_DATA[neighbor.imgIndex], neighbor.rotation);
                if (nSides[OPPOSITE[side]] !== type) return false;
            }
            return true;
        }

        // Владелец: только фишки этого объекта и в своей зоне
        function getOwner(segments, type) {
            const counts = { blue: 0, red: 0 };
            const seen = new Set();
            for (const seg of segments) {
                const parts = seg.split(',');
                const rr = parseInt(parts[0]), cc = parseInt(parts[1]), side = parts[2];
                const key = `${rr},${cc},${side}`;
                if (seen.has(key)) continue;
                seen.add(key);

                const tile = carBoardData[rr][cc];
                if (!tile || !tile.meeple) continue;
                if (tile.meeple.zone !== side) continue;
                counts[tile.meeple.color] += 1;
            }
            if (counts.blue > counts.red) return 'blue';
            if (counts.red > counts.blue) return 'red';
            return null;
        }

        // Вернуть фишки, стоящие в этом объекте (только этой зоны)
        function returnMeeples(segments, type) {
            const seen = new Set();
            for (const seg of segments) {
                const parts = seg.split(',');
                const rr = parseInt(parts[0]), cc = parseInt(parts[1]), side = parts[2];
                const key = `${rr},${cc},${side}`;
                if (seen.has(key)) continue;
                seen.add(key);

                const tile = carBoardData[rr][cc];
                if (!tile || !tile.meeple) continue;
                if (tile.meeple.zone !== side) continue;

                if (tile.meeple.color === 'blue') blueMeeples++;
                else redMeeples++;
                tile.meeple = null;
            }
        }

        // Очки после постановки тайла
        function updateScoresAfterPlacement(r, c) {
            const tile = carBoardData[r][c];
            if (!tile.segments) return;

            const sides = getRotatedSides(TILE_DATA[tile.imgIndex], tile.rotation);

            const cityRoots = new Set();
            const roadRoots = new Set();
            for (const side in tile.segments) {
                const t = sides[side];
                const root = dsu.find(segKey(r, c, side));
                if (t === 'C') cityRoots.add(root);
                else if (t === 'R') roadRoots.add(root);
            }

            for (const root of cityRoots) {
                const segments = getObjectSegments(root, 'C');
                if (segments.length === 0) continue;
                if (!isObjectComplete(segments, 'C')) continue;

                const owner = getOwner(segments, 'C');
                let pts = segments.length * 2;
                for (const seg of segments) {
                    const p = seg.split(',');
                    const t = carBoardData[parseInt(p[0])][parseInt(p[1])];
                    if (TILE_DATA[t.imgIndex].crest) pts += 2;
                }
                if (owner === 'blue') bluePoints += pts;
                if (owner === 'red') redPoints += pts;
                returnMeeples(segments, 'C');
            }

            for (const root of roadRoots) {
                const segments = getObjectSegments(root, 'R');
                if (segments.length === 0) continue;
                if (!isObjectComplete(segments, 'R')) continue;

                const owner = getOwner(segments, 'R');
                const pts = segments.length;
                if (owner === 'blue') bluePoints += pts;
                if (owner === 'red') redPoints += pts;
                returnMeeples(segments, 'R');
            }

            // Монастырь
            if (TILE_DATA[tile.imgIndex].center === 'M') {
                if (isMonasteryComplete(r, c)) {
                    if (tile.meeple && tile.meeple.zone === 'center') {
                        if (tile.meeple.color === 'blue') { bluePoints += 9; blueMeeples++; }
                        else { redPoints += 9; redMeeples++; }
                        tile.meeple = null;
                    }
                }
            }

            updateUI();
        }

        function isMonasteryComplete(r, c) {
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    if (dr === 0 && dc === 0) continue;
                    const nr = r + dr, nc = c + dc;
                    if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE) return false;
                    if (carBoardData[nr][nc] === null) return false;
                }
            }
            return true;
        }

        // ==========================================
        // РАЗМЕЩЕНИЕ ФИШКИ
        // ==========================================
        function startMeeplePlacement() {
            if (lastPlacedR === -1 || lastPlacedC === -1) return;
            if (carBoardData[lastPlacedR][lastPlacedC].meeple) return;

            const tileData = carBoardData[lastPlacedR][lastPlacedC];
            const img = document.getElementById('meeple-tile-img');
            img.src = `${TILE_FOLDER}tile_${tileData.imgIndex}${FILE_EXTENSION}`;
            img.style.transform = `rotate(${tileData.rotation}deg)`;

            document.getElementById('meeple-modal').style.display = 'flex';
        }

        function closeMeepleModal() {
            document.getElementById('meeple-modal').style.display = 'none';
        }

        function placeMeeple(zone) {
            if (lastPlacedR === -1 || lastPlacedC === -1) return;

            const tileData = TILE_DATA[carBoardData[lastPlacedR][lastPlacedC].imgIndex];
            const rotatedSides = getRotatedSides(tileData, carBoardData[lastPlacedR][lastPlacedC].rotation);

            let isValidZone = false;
            if (zone === 'center') {
                if (tileData.center === 'M') isValidZone = true;
            } else if (rotatedSides[zone] === 'R' || rotatedSides[zone] === 'C') {
                isValidZone = true;
            }

            if (!isValidZone) {
                document.getElementById('status-text').innerText = "В это место фишку нельзя поставить! Выбери дорогу, город или монастырь.";
                closeMeepleModal();
                return;
            }

            // Проверка: есть ли чужая фишка в этом объекте
            if (zone !== 'center') {
                const seg = segKey(lastPlacedR, lastPlacedC, zone);
                if (dsu.parent[seg] !== undefined) {
                    const root = dsu.find(seg);
                    const type = rotatedSides[zone];
                    const segments = getObjectSegments(root, type);
                    const opponent = currentPlayer === 'blue' ? 'red' : 'blue';
                    const seen = new Set();
                    for (const s of segments) {
                        const parts = s.split(',');
                        const rr = parseInt(parts[0]), cc = parseInt(parts[1]), side = parts[2];
                        const key = `${rr},${cc},${side}`;
                        if (seen.has(key)) continue;
                        seen.add(key);
                        const t = carBoardData[rr][cc];
                        if (t && t.meeple && t.meeple.color === opponent && t.meeple.zone === side) {
                            document.getElementById('status-text').innerText = "Сюда нельзя! Здесь уже есть фишка соперника.";
                            closeMeepleModal();
                            return;
                        }
                    }
                }
            }

            closeMeepleModal();

            carBoardData[lastPlacedR][lastPlacedC].meeple = {
                color: currentPlayer,
                zone: zone
            };

            if (currentPlayer === 'blue') blueMeeples--;
            else redMeeples--;

            renderCarBoard();
            updateUI();
            endTurn();
        }

        function skipTurn() {
            if (currentTileIndex !== null) {
                document.getElementById('status-text').innerText = "Сначала поставьте тайл!";
                return;
            }
            endTurn();
        }

        function endTurn() {
            currentPlayer = currentPlayer === 'blue' ? 'red' : 'blue';
            updateUI();
            document.getElementById('status-text').innerText = `Ход ${currentPlayer === 'blue' ? 'Синих' : 'Красных'}.`;
        }

        // ==========================================
        // РЕНДЕР ДОСКИ
        // ==========================================
        function renderCarBoard() {
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.querySelector(`.car-cell[data-row="${r}"][data-col="${c}"]`);
                    cell.innerHTML = '';
                    if (carBoardData[r][c] !== null) {
                        const tileData = carBoardData[r][c];
                        const img = document.createElement('img');
                        img.src = `${TILE_FOLDER}tile_${tileData.imgIndex}${FILE_EXTENSION}`;
                        img.className = 'tile-img';
                        img.style.transform = `rotate(${tileData.rotation}deg)`;
                        cell.appendChild(img);

                        if (tileData.meeple) {
                            const meeple = document.createElement('div');
                            meeple.className = `meeple ${tileData.meeple.color}`;
                            if (tileData.meeple.zone === 'top') meeple.style.top = '5px';
                            else if (tileData.meeple.zone === 'bottom') meeple.style.bottom = '5px';
                            else if (tileData.meeple.zone === 'left') meeple.style.left = '5px';
                            else if (tileData.meeple.zone === 'right') meeple.style.right = '5px';
                            else if (tileData.meeple.zone === 'center') {
                                meeple.style.top = '50%';
                                meeple.style.left = '50%';
                                meeple.style.transform = 'translate(-50%, -50%)';
                            }
                            cell.appendChild(meeple);
                        }
                    }
                }
            }
        }

        // ==========================================
        // ФИНАЛЬНЫЙ ПОДСЧЁТ
        // ==========================================
        function endGame() {
            const roots = new Set();
            for (const seg of allSegments) roots.add(dsu.find(seg));

            for (const root of roots) {
                // Города
                const citySegs = getObjectSegments(root, 'C');
                if (citySegs.length > 0 && !isObjectComplete(citySegs, 'C')) {
                    const owner = getOwner(citySegs, 'C');
                    let pts = citySegs.length;
                    for (const seg of citySegs) {
                        const p = seg.split(',');
                        const t = carBoardData[parseInt(p[0])][parseInt(p[1])];
                        if (TILE_DATA[t.imgIndex].crest) pts += 1;
                    }
                    if (owner === 'blue') bluePoints += pts;
                    if (owner === 'red') redPoints += pts;
                }

                // Дороги
                const roadSegs = getObjectSegments(root, 'R');
                if (roadSegs.length > 0 && !isObjectComplete(roadSegs, 'R')) {
                    const owner = getOwner(roadSegs, 'R');
                    if (owner === 'blue') bluePoints += roadSegs.length;
                    if (owner === 'red') redPoints += roadSegs.length;
                }
            }

            // Монастыри
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const tile = carBoardData[r][c];
                    if (!tile) continue;
                    if (TILE_DATA[tile.imgIndex].center !== 'M') continue;
                    if (!tile.meeple || tile.meeple.zone !== 'center') continue;

                    let neighbors = 0;
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            if (dr === 0 && dc === 0) continue;
                            const nr = r + dr, nc = c + dc;
                            if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && carBoardData[nr][nc]) neighbors++;
                        }
                    }
                    const pts = 1 + neighbors;
                    if (tile.meeple.color === 'blue') { bluePoints += pts; blueMeeples++; }
                    else { redPoints += pts; redMeeples++; }
                    tile.meeple = null;
                }
            }

            updateUI();
            renderCarBoard();

            let resultText = "";
            if (bluePoints > redPoints) resultText = "🏆 Победили Синие!";
            else if (redPoints > bluePoints) resultText = "🏆 Победили Красные!";
            else resultText = "🤝 Ничья!";

            const content = document.getElementById('final-score-content');
            content.innerHTML = `
                <div class="score-line blue-name">Синие: ${bluePoints}</div>
                <div class="score-line red-name">Красные: ${redPoints}</div>
                <div class="score-line" style="margin-top:20px;">${resultText}</div>
            `;
            document.getElementById('final-score-screen').style.display = 'flex';
        }

        function closeFinalScreen() {
            document.getElementById('final-score-screen').style.display = 'none';
        }

        // ==========================================
        // ЗАПУСК
        // ==========================================
        initCarcassonne();
    </script>
