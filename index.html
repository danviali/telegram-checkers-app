<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Шашки Онлайн</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #0b0e14; color: #ffffff; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            min-height: 100vh; padding: 15px; overflow: hidden; 
        }
        
        /* --- МЕНЮ --- */
        #menu-screen { display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 10; }
        .menu-btn { padding: 15px 30px; font-size: 18px; font-weight: 700; border: none; border-radius: 12px; cursor: pointer; transition: transform 0.1s; width: 250px; color: white; }
        .menu-btn:active { transform: scale(0.95); }
        .btn-easy { background: linear-gradient(135deg, #00b09b, #96c93d); box-shadow: 0 4px 15px rgba(0, 176, 155, 0.3); }
        .btn-medium { background: linear-gradient(135deg, #f7971e, #ffd200); color: #1a1a1a; box-shadow: 0 4px 15px rgba(247, 151, 30, 0.3); }
        .btn-hard { background: linear-gradient(135deg, #ff007f, #ff4b2b); box-shadow: 0 4px 15px rgba(255, 0, 127, 0.3); }

        /* --- ИГРА --- */
        #game-screen { display: none; flex-direction: column; align-items: center; width: 100%; }
        .header { margin-bottom: 15px; text-align: center; }
        .header h1 { font-size: 24px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 6px; background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #status { font-size: 13px; color: #6c7a89; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }

        /* Контейнер доски */
        .board-container { 
            width: 100%; max-width: 360px; aspect-ratio: 1 / 1; 
            background: #0f131a; padding: 5px; border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6); 
        }
        
        /* Жесткая сетка 8x8 */
        .board { 
            display: grid; 
            grid-template-columns: repeat(8, 1fr); 
            grid-template-rows: repeat(8, 1fr); 
            width: 100%; height: 100%; 
            border-radius: 8px; overflow: hidden; 
        }
        
        .cell { 
            width: 100%; height: 100%; 
            display: flex; align-items: center; justify-content: center; 
            position: relative; 
        }
        
        /* Цвета клеток (теперь они никогда не поменяются) */
        .light { background-color: #1e2633; }
        .dark { background-color: #131821; }

        /* Шашки */
        .piece { 
            width: 75%; height: 75%; border-radius: 50%; 
            cursor: pointer; transition: transform 0.1s; 
            position: relative; z-index: 2; 
        }
        .piece:active { transform: scale(0.9); }
        .red-piece { background: linear-gradient(135deg, #ff007f 0%, #ff4b2b 100%); box-shadow: 0 4px 10px rgba(255, 0, 127, 0.4); border: 1px solid rgba(255,255,255,0.2); }
        .black-piece { background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); box-shadow: 0 4px 10px rgba(0, 242, 254, 0.4); border: 1px solid rgba(255,255,255,0.2); }
        
        /* Дамка */
        .king-piece { 
            border: 3px solid #f1c40f !important; 
            box-shadow: 0 0 15px #f1c40f !important; 
        }
        /* Подсветка выбранной шашки */
        .selected { border: 3px solid #ffffff !important; box-shadow: 0 0 10px #ffffff !important; }
    </style>
</head>
<body>

    <div id="menu-screen">
        <h1 style="background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 28px; margin-bottom: 20px;">Выбери сложность</h1>
        <button class="menu-btn btn-easy" onclick="startGame('easy')">🟢 Легко</button>
        <button class="menu-btn btn-medium" onclick="startGame('medium')">🟡 Средне</button>
        <button class="menu-btn btn-hard" onclick="startGame('hard')">🔴 Сложно</button>
    </div>

    <div id="game-screen">
        <div class="header">
            <h1 id="player-name">Шашки Арена 🏆</h1>
            <div id="status">Твой ход!</div>
        </div>
        <div class="board-container">
            <div class="board" id="game-board"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); tg.ready();

        const boardElement = document.getElementById('game-board');
        const statusElement = document.getElementById('status');
        const nameElement = document.getElementById('player-name');
        const menuScreen = document.getElementById('menu-screen');
        const gameScreen = document.getElementById('game-screen');

        let selectedCell = null;
        let isPlayerTurn = true;
        let currentDifficulty = 'easy';
        let board = []; // Логическая доска 8x8. 'r' - красная, 'b' - черная, 'R'/'B' - дамки, null - пусто.

        try {
            if (tg.initDataUnsafe?.user?.first_name) {
                nameElement.innerText = `${tg.initDataUnsafe.user.first_name} 👑`;
            } else {
                nameElement.innerText = "Игрок 👑";
            }
        } catch (e) {}

        function startGame(difficulty) {
            currentDifficulty = difficulty;
            menuScreen.style.display = 'none';
            gameScreen.style.display = 'flex';
            initBoard();
            isPlayerTurn = true;
            statusElement.innerText = "Твой ход! Нажми на красную шашку";
        }

        // --- ИНИЦИАЛИЗАЦИЯ И ОТРИСОВКА ---
        function initBoard() {
            boardElement.innerHTML = '';
            board = Array(8).fill(null).map(() => Array(8).fill(null));

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const cell = document.createElement('div');
                    // Жесткая привязка цвета: если сумма четная - светлая, иначе темная
                    cell.className = `cell ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    cell.addEventListener('click', () => onCellClick(r, c));
                    boardElement.appendChild(cell);
                }
            }
            // Расстановка по правилам (только на темных клетках)
            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 8; c++) {
                    if ((r + c) % 2 !== 0) board[r][c] = 'b'; // Черные сверху
                }
            }
            for (let r = 5; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if ((r + c) % 2 !== 0) board[r][c] = 'r'; // Красные снизу
                }
            }
            renderBoard();
        }

        // Отрисовка фигур поверх сетки
        function renderBoard() {
            document.querySelectorAll('.piece').forEach(p => p.remove());
            
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (board[r][c]) {
                        const cell = document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
                        const piece = document.createElement('div');
                        const colorClass = (board[r][c].toLowerCase() === 'r') ? 'red-piece' : 'black-piece';
                        piece.className = `piece ${colorClass}`;
                        
                        if (board[r][c] === 'R' || board[r][c] === 'B') {
                            piece.classList.add('king-piece');
                        }
                        cell.appendChild(piece);
                    }
                }
            }
        }

        function highlightCell(r, c, isSelected) {
            const cell = document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
            if (isSelected) {
                cell.style.boxShadow = "inset 0 0 0 3px #f1c40f";
            } else {
                cell.style.boxShadow = "none";
            }
        }

        // --- ЛОГИКА ХОДОВ ИГРОКА ---
        function onCellClick(r, c) {
            if (!isPlayerTurn) return;

            // Если кликнули по своей шашке
            if (board[r][c] && board[r][c].toLowerCase() === 'r') {
                // Если есть обязательное взятие, проверяем, может ли эта шашка бить
                const captures = getAllMoves('r').filter(m => m.isCapture);
                if (captures.length > 0 && !captures.some(m => m.fromRow === r && m.fromCol === c)) {
                    statusElement.innerText = "Есть обязательное взятие! Выбери другую шашку.";
                    return;
                }

                if (selectedCell) highlightCell(selectedCell.r, selectedCell.c, false);
                selectedCell = { r, c };
                highlightCell(r, c, true);
                statusElement.innerText = "Шашка выбрана! Выбери куда ходить.";
                return;
            }

            // Если кликнули по пустой клетке и шашка выбрана
            if (selectedCell && !board[r][c]) {
                const moves = getValidMovesForPiece(selectedCell.r, selectedCell.c);
                const targetMove = moves.find(m => m.toRow === r && m.toCol === c);

                if (targetMove) {
                    // Проверка на обязательное взятие
                    const allCaptures = getAllMoves('r').filter(m => m.isCapture);
                    if (allCaptures.length > 0 && !targetMove.isCapture) {
                        statusElement.innerText = "Ты должен рубить! Выбери другое действие.";
                        return;
                    }

                    executeMove(targetMove);
                    highlightCell(selectedCell.r, selectedCell.c, false);
                    selectedCell = null;
                    
                    // Проверка на цепное взятие
                    const furtherCaptures = getValidMovesForPiece(r, c).filter(m => m.isCapture);
                    if (targetMove.isCapture && furtherCaptures.length > 0) {
                        selectedCell = { r, c };
                        highlightCell(r, c, true);
                        statusElement.innerText = "Продолжай рубить этой же шашкой!";
                    } else {
                        endTurn();
                    }
                }
            }
        }

        // --- ГЕНЕРАЦИЯ ХОДОВ ---
        function getAllMoves(color) {
            let moves = [];
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (board[r][c] && board[r][c].toLowerCase() === color) {
                        moves = moves.concat(getValidMovesForPiece(r, c));
                    }
                }
            }
            return moves;
        }

        function getValidMovesForPiece(r, c) {
            const piece = board[r][c];
            const isKing = piece === piece.toUpperCase();
            const color = piece.toLowerCase();
            let moves = [];
            
            // 1. Ищем взятия
            const dirs = [[-1,-1], [-1,1], [1,-1], [1,1]];
            for (let [dr, dc] of dirs) {
                if (isKing) {
                    let dist = 1;
                    let enemyFound = false;
                    let enemyR, enemyC;
                    while (true) {
                        let nr = r + dr * dist, nc = c + dc * dist;
                        if (nr < 0 || nr > 7 || nc < 0 || nc > 7) break;
                        
                        if (board[nr][nc]) {
                            if (board[nr][nc].toLowerCase() === color) break; // Своя шашка
                            if (enemyFound) break; // Второй враг на пути
                            enemyFound = true;
                            enemyR = nr; enemyC = nc;
                        } else if (enemyFound) {
                            // Пустая клетка за врагом - можно бить
                            moves.push({ fromRow: r, fromCol: c, toRow: nr, toCol: nc, isCapture: true, capturedRow: enemyR, capturedCol: enemyC });
                        }
                        dist++;
                    }
                } else {
                    let nr = r + dr, nc = c + dc;
                    let tr = r + dr * 2, tc = c + dc * 2;
                    if (tr >= 0 && tr <= 7 && tc >= 0 && tc <= 7 && !board[tr][tc]) {
                        if (board[nr]?.[nc] && board[nr][nc].toLowerCase() !== color) {
                            moves.push({ fromRow: r, fromCol: c, toRow: tr, toCol: tc, isCapture: true, capturedRow: nr, capturedCol: nc });
                        }
                    }
                }
            }
            // Если есть взятия, обычные ходы запрещены
            if (moves.length > 0) return moves;

            // 2. Обычные ходы (если нет взятий)
            if (isKing) {
                for (let [dr, dc] of dirs) {
                    let dist = 1;
                    while (true) {
                        let nr = r + dr * dist, nc = c + dc * dist;
                        if (nr < 0 || nr > 7 || nc < 0 || nc > 7) break;
                        if (board[nr][nc]) break;
                        moves.push({ fromRow: r, fromCol: c, toRow: nr, toCol: nc, isCapture: false });
                        dist++;
                    }
                }
            } else {
                let dir = (color === 'r') ? -1 : 1; // Красные вверх, черные вниз
                for (let dc of [-1, 1]) {
                    let nr = r + dir, nc = c + dc;
                    if (nr >= 0 && nr <= 7 && nc >= 0 && nc <= 7 && !board[nr][nc]) {
                        moves.push({ fromRow: r, fromCol: c, toRow: nr, toCol: nc, isCapture: false });
                    }
                }
            }
            return moves;
        }

        // --- ВЫПОЛНЕНИЕ ХОДА ---
        function executeMove(move) {
            let piece = board[move.fromRow][move.fromCol];
            
            if (move.isCapture) {
                board[move.capturedRow][move.capturedCol] = null;
            }
            
            board[move.fromRow][move.fromCol] = null;
            
            // Превращение в дамку
            if (piece === 'r' && move.toRow === 0) piece = 'R';
            if (piece === 'b' && move.toRow === 7) piece = 'B';
            
            board[move.toRow][move.toCol] = piece;
            renderBoard();
        }

        function endTurn() {
            isPlayerTurn = false;
            statusElement.innerText = "Ход бота... 🤖";
            setTimeout(botMove, 400);
        }

        // --- ЛОГИКА БОТА ---
        function botMove() {
            if (checkGameOver()) return;

            let allMoves = getAllMoves('b');
            let captureMoves = allMoves.filter(m => m.isCapture);
            let validMoves = captureMoves.length > 0 ? captureMoves : allMoves;

            if (validMoves.length === 0) {
                statusElement.innerText = "Боту некуда ходить! Ты победил! 🎉";
                isPlayerTurn = true;
                return;
            }

            let chosenMove;

            if (currentDifficulty === 'easy') {
                // Легко: случайный ход (иногда поддается)
                chosenMove = validMoves[Math.floor(Math.random() * validMoves.length)];
            } else if (currentDifficulty === 'medium') {
                // Средне: бьет, если может, иначе случайно, но предпочитает двигаться вперед
                if (captureMoves.length > 0) {
                    chosenMove = captureMoves[Math.floor(Math.random() * captureMoves.length)];
                } else {
                    // Сортируем обычные ходы, чтобы бот шел вперед (для черных row растет)
                    validMoves.sort((a, b) => b.toRow - a.toRow);
                    chosenMove = validMoves[0];
                }
            } else {
                // Сложно: Минимакс (упрощенный, оценивает ход на 1 шаг вперед)
                chosenMove = getBestMoveForBot(validMoves);
            }

            executeMove(chosenMove);
            
            // Если бот может бить дальше, он продолжает (для простоты пропускаем этот шаг, но ход передаем)
            if (checkGameOver()) return;
            
            isPlayerTurn = true;
            statusElement.innerText = "Твой ход! Нажми на красную шашку";
        }

        function getBestMoveForBot(moves) {
            let bestMove = moves[0];
            let bestScore = -Infinity;

            for (let move of moves) {
                let score = 0;
                // 1. Приоритет взятия
                if (move.isCapture) score += 100;
                
                // 2. Приоритет продвижения в дамки
                if (move.toRow === 7) score += 50;
                
                // 3. Безопасность: не подставляться под удар (проверяем, может ли красная побить нашу шашку после хода)
                // Делаем виртуальный ход
                let tempPiece = board[move.fromRow][move.fromCol];
                board[move.fromRow][move.fromCol] = null;
                if (move.isCapture) board[move.capturedRow][move.capturedCol] = null;
                board[move.toRow][move.toCol] = tempPiece;

                // Ищем, может ли кто-то из красных побить эту шашку
                let isVulnerable = false;
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        if (board[r][c] && board[r][c].toLowerCase() === 'r') {
                            let redMoves = getValidMovesForPiece(r, c);
                            if (redMoves.some(m => m.isCapture && m.capturedRow === move.toRow && m.capturedCol === move.toCol)) {
                                isVulnerable = true;
                                break;
                            }
                        }
                    }
                    if (isVulnerable) break;
                }
                
                // Откатываем виртуальный ход
                board[move.toRow][move.toCol] = null;
                if (move.isCapture) board[move.capturedRow][move.capturedCol] = tempPiece === 'b' ? 'r' : 'R'; // Возвращаем врага (очень грубо, но для оценки сойдет)
                board[move.fromRow][move.fromCol] = tempPiece;

                if (isVulnerable) score -= 80; // Штраф за подставу

                // 4. Ближе к центру
                score -= Math.abs(3.5 - move.toCol) * 2;
                
                if (score > bestScore) {
                    bestScore = score;
                    bestMove = move;
                }
            }
            return bestMove;
        }

        function checkGameOver() {
            const reds = board.flat().filter(p => p && p.toLowerCase() === 'r').length;
            const blacks = board.flat().filter(p => p && p.toLowerCase() === 'b').length;
            
            if (reds === 0) {
                statusElement.innerText = "Ты проиграл! 🤖 Победил бот.";
                isPlayerTurn = false;
                return true;
            }
            if (blacks === 0) {
                statusElement.innerText = "Ты победил! 🎉 Бот повержен.";
                isPlayerTurn = false;
                return true;
            }
            
            // Проверка на пат (нет ходов)
            if (isPlayerTurn && getAllMoves('r').length === 0) {
                 statusElement.innerText = "У тебя нет ходов! Ты проиграл.";
                 isPlayerTurn = false;
                 return true;
            }
            
            return false;
        }

        window.startGame = startGame;
    </script>
</body>
</html>
