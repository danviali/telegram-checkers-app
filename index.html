<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Шашки Онлайн</title>
    <!-- ИСПРАВЛЕНО: правильный скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ... ваши стили остаются без изменений ... */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #0b0e14; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 15px; overflow: hidden; }
        .header { margin-bottom: 25px; text-align: center; }
        .header h1 { font-size: 24px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 6px; background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #status { font-size: 13px; color: #6c7a89; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }
        .board-container { width: 100%; max-width: 360px; aspect-ratio: 1 / 1; background: linear-gradient(145deg, #161c26, #0f131a); padding: 8px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(79, 172, 254, 0.1); }
        .board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: 100%; height: 100%; border-radius: 10px; overflow: hidden; }
        .cell { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .light { background-color: #1e2633; }
        .dark { background-color: #131821; }
        .piece { width: 78%; height: 78%; border-radius: 50%; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); position: relative; }
        .piece::after { content: ''; position: absolute; top: 10%; left: 15%; width: 70%; height: 35%; background: linear-gradient(to bottom, rgba(255,255,255,0.25), rgba(255,255,255,0)); border-radius: 50% / 40% 40% 0 0; }
        .piece:active { transform: scale(0.88); }
        .red-piece { background: linear-gradient(135deg, #ff007f 0%, #ff4b2b 100%); border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 4px 12px rgba(255, 0, 127, 0.4); }
        .black-piece { background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 4px 12px rgba(0, 242, 254, 0.4); }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="player-name">Шашки Арена 🏆</h1>
        <div id="status">Твой ход! Нажми на красную шашку</div>
    </div>

    <div class="board-container">
        <div class="board" id="game-board"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        tg.ready();

        const boardElement = document.getElementById('game-board');
        const statusElement = document.getElementById('status');
        const nameElement = document.getElementById('player-name');

        let selectedPiece = null;
        let isPlayerTurn = true; // НОВОЕ: флаг, чей сейчас ход

        try {
            if (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) {
                nameElement.innerText = `${tg.initDataUnsafe.user.first_name} 👑`;
            } else {
                nameElement.innerText = "Игрок 👑";
            }
        } catch (e) {
            nameElement.innerText = "Игрок 👑";
        }

        function createBoard() {
            boardElement.innerHTML = ''; 
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const cell = document.createElement('div');
                    cell.className = `cell ${(row + col) % 2 === 0 ? 'light' : 'dark'}`;
                    cell.dataset.row = row;
                    cell.dataset.col = col;

                    cell.addEventListener('click', (e) => {
                        // НОВОЕ: ходить можно только если сейчас ход игрока
                        if (!isPlayerTurn) return;
                        // НОВОЕ: ходить можно только красной шашкой
                        if (selectedPiece && cell.classList.contains('dark') && !cell.hasChildNodes() && selectedPiece.classList.contains('red-piece')) {
                            movePiece(selectedPiece, cell);
                        }
                    });
                    
                    if ((row + col) % 2 !== 0) {
                        if (row < 3) {
                            const piece = createPiece('piece black-piece');
                            cell.appendChild(piece);
                        } else if (row > 4) {
                            const piece = createPiece('piece red-piece');
                            cell.appendChild(piece);
                        }
                    }
                    boardElement.appendChild(cell);
                }
            }
        }

        // НОВОЕ: вынес логику хода в отдельную функцию
        function movePiece(piece, cell) {
            cell.appendChild(piece);
            piece.style.border = "1px solid rgba(255, 255, 255, 0.2)";
            selectedPiece = null;
            isPlayerTurn = false; // Передаем ход боту
            statusElement.innerText = "Ход бота... 🤖";
            
            // Запускаем ход бота с небольшой задержкой для реализма
            setTimeout(botMove, 800); 
        }

        function createPiece(className) {
            const piece = document.createElement('div');
            piece.className = className;

            piece.addEventListener('click', (e) => {
                e.stopPropagation(); 
                // НОВОЕ: выбирать можно только свои (красные) шашки и только в свой ход
                if (!isPlayerTurn || !piece.classList.contains('red-piece')) return;

                if (selectedPiece) {
                    selectedPiece.style.border = "1px solid rgba(255, 255, 255, 0.2)";
                }
                selectedPiece = piece;
                piece.style.border = "3px solid #f1c40f"; 
                statusElement.innerText = "Шашка выбрана! Нажми куда ходить";
            });

            return piece;
        }

        // НОВОЕ: Простой AI для бота
        function botMove() {
            const allBlackPieces = document.querySelectorAll('.black-piece');
            const allDarkCells = Array.from(document.querySelectorAll('.cell.dark'));

            // Собираем возможные ходы: шашка + пустая клетка
            let possibleMoves = [];
            allBlackPieces.forEach(piece => {
                const pieceCell = piece.parentElement;
                const pieceRow = parseInt(pieceCell.dataset.row);
                const pieceCol = parseInt(pieceCell.dataset.col);

                allDarkCells.forEach(targetCell => {
                    if (targetCell.hasChildNodes()) return; // Клетка занята
                    const targetRow = parseInt(targetCell.dataset.row);
                    const targetCol = parseInt(targetCell.dataset.col);

                    // Простое правило: бот может ходить на одну клетку по диагонали вниз (для черных)
                    if (targetRow === pieceRow + 1 && (targetCol === pieceCol - 1 || targetCol === pieceCol + 1)) {
                        possibleMoves.push({ piece, targetCell });
                    }
                });
            });

            if (possibleMoves.length > 0) {
                // Выбираем случайный ход из возможных
                const randomMove = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                randomMove.targetCell.appendChild(randomMove.piece);
            } else {
                statusElement.innerText = "Боту некуда ходить!";
            }

            // Возвращаем ход игроку
            isPlayerTurn = true;
            statusElement.innerText = "Твой ход! Нажми на красную шашку";
        }

        createBoard();
    </script>
</body>
</html>
