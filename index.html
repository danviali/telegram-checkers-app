        .btn-hard { background: linear-gradient(135deg, #ff007f, #ff4b2b); box-shadow: 0 4px 15px rgba(255, 0, 127, 0.3); }

        .helper-toggle:active { transform: scale(0.98); }
        .helper-toggle input { display: none; }
        .checkmark { width: 24px; height: 24px; border-radius: 6px; border: 2px solid #4facfe; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .helper-toggle input:checked ~ .checkmark { background: #4facfe; }
        .checkmark::after { content: "✔"; color: #fff; font-size: 16px; font-weight: bold; opacity: 0; transition: 0.2s; }
        .helper-toggle input:checked ~ .checkmark::after { opacity: 1; }
        .helper-label { font-size: 14px; font-weight: 600; color: #c9d1d9; }

        /* --- ЭКРАН ОЖИДАНИЯ --- */
        #waiting-screen { display: none; flex-direction: column; align-items: center; gap: 20px; z-index: 10; width: 100%; text-align: center; }

        #waiting-screen p { color: #6c7a89; font-size: 14px; word-break: break-word; padding: 0 20px; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.1); border-top: 5px solid #4facfe; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .header h1.black-color { background: linear-gradient(135deg, #ff007f 0%, #ff4b2b 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        #status { font-size: 13px; color: #6c7a89; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; line-height: 1.2; }

        .end-btn:active { transform: scale(0.95); }
        .end-btn.primary { background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); border: none; color: #0b0e14; }

        .board-container { width: 100%; max-width: 360px; aspect-ratio: 1 / 1; background: #0f131a; padding: 5px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); position: relative; touch-action: none; }
        .board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: 100%; height: 100%; border-radius: 8px; overflow: hidden; }
        .cell { width: 100%; height: 100%; position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .light { background-color: #1e2633; }
        .dark { background-color: #131821; }

        .piece { width: 78%; height: 78%; border-radius: 50%; position: absolute; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s; pointer-events: auto; cursor: pointer; z-index: 2; }
        .piece:active { transform: scale(0.9); }
        .red-piece { background: linear-gradient(135deg, #ff007f 0%, #ff4b2b 100%); box-shadow: 0 4px 10px rgba(255,0,127,0.4); border: 1px solid rgba(255,255,255,0.2); }

        .selected { border: 3px solid #ffffff !important; box-shadow: 0 0 10px #ffffff !important; transform: scale(1.1); z-index: 10;}
        .hint-piece { box-shadow: 0 0 15px #2ecc71, 0 0 25px #2ecc71 !important; border: 2px solid #2ecc71 !important; }
        .fade-out { opacity: 0; transform: scale(0); }

        #carcassonne-screen { display: none; flex-direction: column; align-items: center; width: 100%; }
        
        /* Панели игроков */

        .player-name.blue { color: #00f2fe; }
        .player-meeples { font-size: 14px; color: #c9d1d9; }
        .active-player { border: 2px solid #f1c40f; box-shadow: 0 0 10px rgba(241, 196, 15, 0.3); }

            grid-template-columns: repeat(9, 40px); 
            grid-template-rows: repeat(9, 40px); 
            gap: 1px; 
            background: #1e2633; 
            padding: 5px; 
            border-radius: 8px; 
            margin-top: 10px;
            position: relative;
        }

            width: 40px; height: 40px; 
            background: #131821; 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer;
            position: relative;
        }
        .tile-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
        .meeple { width: 14px; height: 14px; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 2px solid white; z-index: 10; }
        .meeple.red { background: #ff007f; }

        .btn-green { background: #2ecc71; }

        function onCarCellClick(r, c) {

            const isFirstMove = carBoardData.flat().every(cell => cell === null);

                const center = Math.floor(BOARD_SIZE / 2);
                if (r !== center || c !== center) {
                    document.getElementById('status-text').innerText = "Первый тайл должен быть в центре!";
                    return;
                }
            } else {
                const isValid = checkCarPlacement(r, c);
                if (!isValid) {
                    document.getElementById('status-text').innerText = "Сюда нельзя ставить тайл (не совпадают края)!";
                    return;
                }
            }

            carBoardData[r][c] = {

                meeple: null

        function checkCarPlacement(r, c) {
            const currentTile = TILE_DATA[currentTileIndex];
            if (!currentTile) return false;
            const rotatedSides = getRotatedSides(currentTile, currentRotation);

            let hasNeighbor = false;
            const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];

            for (let [dr, dc] of dirs) {
                let nr = r + dr, nc = c + dc;
                if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE) continue;
                if (carBoardData[nr][nc] === null) continue;

                hasNeighbor = true;
                const neighborData = carBoardData[nr][nc];
                const neighborTile = TILE_DATA[neighborData.imgIndex];
                if (!neighborTile) continue;
                
                const neighborSides = getRotatedSides(neighborTile, neighborData.rotation);

                let currentSide, neighborSide;
                if (dr === -1) { currentSide = 'top'; neighborSide = 'bottom'; }
                if (dr === 1) { currentSide = 'bottom'; neighborSide = 'top'; }
                if (dc === -1) { currentSide = 'left'; neighborSide = 'right'; }
                if (dc === 1) { currentSide = 'right'; neighborSide = 'left'; }

                if (rotatedSides[currentSide] !== neighborSides[neighborSide]) {
                    return false;
                }
            }
            return hasNeighbor;
        }

        function getRotatedSides(tile, rotation) {
            let sides = { ...tile };
            if (rotation === 90) {
                sides = { top: tile.left, right: tile.top, bottom: tile.right, left: tile.bottom };
            } else if (rotation === 180) {
                sides = { top: tile.bottom, right: tile.left, bottom: tile.top, left: tile.right };
            } else if (rotation === 270) {
                sides = { top: tile.right, right: tile.bottom, bottom: tile.left, left: tile.top };
            }
            return sides;
        }

        function initOnlineBoard() {

        function updateOnlineBoard(forceRedraw = false) {
            if (!onlineBoard) return;
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    let val = onlineBoard[r][c];

        function movePieceDOM(fR, fC, tR, tC) {

        function onCellClickOnline(r, c) {

                if (targetMove) {

        function startGame(difficulty) {

        function initBoard() {
            boardElement.innerHTML = ''; board = Array(8).fill(null).map(() => Array(8).fill(null)); cellsDOM = Array(8).fill(null).map(() => Array(8).fill(null));
            for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
                const cell = document.createElement('div'); cell.className = `cell ${(r + c) % 2 === 0 ? 'light' : 'dark'}`; cell.dataset.row = r; cell.dataset.col = c;
                cell.addEventListener('click', () => onCellClick(r, c)); boardElement.appendChild(cell); cellsDOM[r][c] = cell;
            }
            for (let r = 0; r < 3; r++) for (let c = 0; c < 8; c++) if ((r + c) % 2 !== 0) board[r][c] = 'b';
            for (let r = 5; r < 8; r++) for (let c = 0; c < 8; c++) if ((r + c) % 2 !== 0) board[r][c] = 'r';
            renderAllPieces();

        function renderAllPieces() {
            document.querySelectorAll('.piece').forEach(p => p.remove());
            for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) if (board[r][c]) createPieceDOM(r, c, board[r][c]);
        }

        function createPieceDOM(r, c, type) {
            const piece = document.createElement('div');
            piece.className = `piece ${type.toLowerCase() === 'r' ? 'red-piece' : 'black-piece'}`;
            if (type === 'R' || type === 'B') piece.classList.add('king-piece');
            piece.dataset.row = r; piece.dataset.col = c;
            cellsDOM[r][c].appendChild(piece);
        }

        function removePieceDOM(r, c) { 
            const p = cellsDOM[r][c].querySelector('.piece'); 
            if (p) { p.classList.add('fade-out'); setTimeout(() => p.remove(), 300); } 
        }

        function updatePiecesVisuals() {
            for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
                const p = cellsDOM[r][c].querySelector('.piece'); if (!p || !board[r][c]) continue;
                if ((board[r][c] === 'R' || board[r][c] === 'B') && !p.classList.contains('king-piece')) p.classList.add('king-piece');
                if (selectedCell && selectedCell.r === r && selectedCell.c === c) p.classList.add('selected'); else p.classList.remove('selected');
                p.classList.remove('hint-piece');
            }
        }

        function getAllMoves(color) {
            let moves = [];
            for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) if (board[r][c] && board[r][c].toLowerCase() === color) moves = moves.concat(getValidMovesForPiece(r, c));
            return moves;
        }

        function getValidMovesForPiece(r, c) {
            const piece = board[r][c]; const isKing = piece === piece.toUpperCase(); const color = piece.toLowerCase(); let moves = [];
            const dirs = [[-1,-1], [-1,1], [1,-1], [1,1]];
            for (let [dr, dc] of dirs) {
                if (isKing) {
                    let dist = 1, enemyFound = false, enemyR, enemyC;
                    while (true) {
                        let nr = r + dr * dist, nc = c + dc * dist; if (nr < 0 || nr > 7 || nc < 0 || nc > 7) break;
                        if (board[nr][nc]) { if (board[nr][nc].toLowerCase() === color) break; if (enemyFound) break; enemyFound = true; enemyR = nr; enemyC = nc; }
                        else if (enemyFound) moves.push({ fromRow: r, fromCol: c, toRow: nr, toCol: nc, isCapture: true, capturedRow: enemyR, capturedCol: enemyC });
                        dist++;
                    }
                } else {
                    let nr = r + dr, nc = c + dc, tr = r + dr * 2, tc = c + dc * 2;
                    if (tr >= 0 && tr <= 7 && tc >= 0 && tc <= 7 && !board[tr][tc] && board[nr]?.[nc] && board[nr][nc].toLowerCase() !== color) {
                        moves.push({ fromRow: r, fromCol: c, toRow: tr, toCol: tc, isCapture: true, capturedRow: nr, capturedCol: nc });
                    }
                }
            }
            if (moves.length > 0) return moves;
            if (isKing) {
                for (let [dr, dc] of dirs) { let dist = 1; while (true) { let nr = r + dr * dist, nc = c + dc * dist; if (nr < 0 || nr > 7 || nc < 0 || nc > 7 || board[nr][nc]) break; moves.push({ fromRow: r, fromCol: c, toRow: nr, toCol: nc, isCapture: false }); dist++; } }
            } else {
                let dir = (color === 'r') ? -1 : 1;
                for (let dc of [-1, 1]) { let nr = r + dir, nc = c + dc; if (nr >= 0 && nr <= 7 && nc >= 0 && nc <= 7 && !board[nr][nc]) moves.push({ fromRow: r, fromCol: c, toRow: nr, toCol: nc, isCapture: false }); }
            }
            return moves;
        }

        function executeMove(move) {
            let pieceType = board[move.fromRow][move.fromCol];
            if (move.isCapture) { board[move.capturedRow][move.capturedCol] = null; removePieceDOM(move.capturedRow, move.capturedCol); }
            board[move.fromRow][move.fromCol] = null;
            if (pieceType === 'r' && move.toRow === 0) pieceType = 'R'; if (pieceType === 'b' && move.toRow === 7) pieceType = 'B';
            board[move.toRow][move.toCol] = pieceType;
            movePieceDOM(move.fromRow, move.fromCol, move.toRow, move.toCol); updatePiecesVisuals();
        }

        function endTurn() { if (checkGameOver()) return; isPlayerTurn = false; clearHints(); statusElement.innerText = "Ход бота... 🤖"; setTimeout(botMove, 400); }
        function showHint() { if (isOnlineMode || !helperCheckbox.checked || !isPlayerTurn || isGameOver) return; let moves = getAllMoves('r'); if (moves.length === 0) return; const best = getBestMoveForPlayer(moves); const p = cellsDOM[best.fromRow][best.fromCol].querySelector('.piece'); if (p) p.classList.add('hint-piece'); statusElement.innerText = best.isCapture ? "💡 Подсказка: Сруби!" : "💡 Подсказка: Сходи этой."; }
        function clearHints() { document.querySelectorAll('.hint-piece').forEach(el => el.classList.remove('hint-piece')); }

        function onCellClick(r, c) {
            if (!isPlayerTurn || isGameOver || isOnlineMode) return;
            if (board[r][c] && board[r][c].toLowerCase() === 'r') {
                const captures = getAllMoves('r').filter(m => m.isCapture);
                if (captures.length > 0 && !captures.some(m => m.fromRow === r && m.fromCol === c)) { statusElement.innerText = "Есть обязательное взятие!"; return; }
                if (selectedCell && selectedCell.r === r && selectedCell.c === c) { selectedCell = null; updatePiecesVisuals(); statusElement.innerText = "Твой ход!"; showHint(); return; }
                selectedCell = { r, c }; updatePiecesVisuals(); statusElement.innerText = "Шашка выбрана!"; return;
            }
            if (selectedCell && !board[r][c]) {
                const moves = getValidMovesForPiece(selectedCell.r, selectedCell.c); const targetMove = moves.find(m => m.toRow === r && m.toCol === c);
                if (targetMove) {
                    const allCaptures = getAllMoves('r').filter(m => m.isCapture);
                    if (allCaptures.length > 0 && !targetMove.isCapture) { statusElement.innerText = "Ты должен рубить!"; return; }
                    clearHints(); executeMove(targetMove);
                    const furtherCaptures = getValidMovesForPiece(r, c).filter(m => m.isCapture);
                    if (targetMove.isCapture && furtherCaptures.length > 0) { selectedCell = { r, c }; updatePiecesVisuals(); statusElement.innerText = "Продолжай рубить!"; }
                    else { selectedCell = null; updatePiecesVisuals(); endTurn(); }
                } else { selectedCell = null; updatePiecesVisuals(); statusElement.innerText = "Так ходить нельзя."; showHint(); }
            }
        }

        function botMove() {
            if (checkGameOver()) return;
            let allMoves = getAllMoves('b'); let captureMoves = allMoves.filter(m => m.isCapture); let validMoves = captureMoves.length > 0 ? captureMoves : allMoves;
            if (validMoves.length === 0) { statusElement.innerText = "Боту некуда ходить! Ты победил! 🎉"; isPlayerTurn = true; return; }
            let chosenMove;
            if (currentDifficulty === 'easy') chosenMove = validMoves[Math.floor(Math.random() * validMoves.length)];
            else if (currentDifficulty === 'medium') { if (captureMoves.length > 0) chosenMove = captureMoves[0]; else { validMoves.sort((a, b) => b.toRow - a.toRow); chosenMove = validMoves[0]; } }
            else chosenMove = getBestMoveForBot(validMoves);
            executeMove(chosenMove);
            if (checkGameOver()) return;
            isPlayerTurn = true; statusElement.innerText = "Твой ход!"; showHint();
        }

        function getBestMoveForBot(moves) {
            let bestMove = moves[0], bestScore = -Infinity;
            for (let move of moves) {
                let score = 0; if (move.isCapture) score += 100; if (move.toRow === 7) score += 50;
                let tempPiece = board[move.fromRow][move.fromCol]; board[move.fromRow][move.fromCol] = null; if (move.isCapture) board[move.capturedRow][move.capturedCol] = null; board[move.toRow][move.toCol] = tempPiece;
                let isVulnerable = false;
                for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) if (board[r][c] && board[r][c].toLowerCase() === 'r') { let redMoves = getValidMovesForPiece(r, c); if (redMoves.some(m => m.isCapture && m.capturedRow === move.toRow && m.capturedCol === move.toCol)) { isVulnerable = true; break; } }
                board[move.toRow][move.toCol] = null; if (move.isCapture) board[move.capturedRow][move.capturedCol] = tempPiece === 'b' ? 'r' : 'R'; board[move.fromRow][move.fromCol] = tempPiece;
                if (isVulnerable) score -= 80; score -= Math.abs(3.5 - move.toCol) * 2;
                if (score > bestScore) { bestScore = score; bestMove = move; }
            }
            return bestMove;
        }

        function getBestMoveForPlayer(moves) {
            let bestMove = moves[0], bestScore = -Infinity;
            for (let move of moves) {
                let score = 0; if (move.isCapture) score += 100; if (move.toRow === 0) score += 50;
                let tempPiece = board[move.fromRow][move.fromCol]; board[move.fromRow][move.fromCol] = null; if (move.isCapture) board[move.capturedRow][move.capturedCol] = null; board[move.toRow][move.toCol] = tempPiece;
                let isVulnerable = false;
                for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) if (board[r][c] && board[r][c].toLowerCase() === 'b') { let botMoves = getValidMovesForPiece(r, c); if (botMoves.some(m => m.isCapture && m.capturedRow === move.toRow && m.capturedCol === move.toCol)) { isVulnerable = true; break; } }
                board[move.toRow][move.toCol] = null; if (move.isCapture) board[move.capturedRow][move.capturedCol] = tempPiece === 'r' ? 'b' : 'B'; board[move.fromRow][move.fromCol] = tempPiece;
                if (isVulnerable) score -= 80; score -= Math.abs(3.5 - move.toCol) * 2;
                if (score > bestScore) { bestScore = score; bestMove = move; }
            }
            return bestMove;
        }

        function checkGameOver() {
            if (isGameOver) return true;
            const reds = board.flat().filter(p => p && p.toLowerCase() === 'r').length;
            const blacks = board.flat().filter(p => p && p.toLowerCase() === 'b').length;
            if (reds === 0) { showGameOver("Ты проиграл! 🤖", false); return true; }
            if (blacks === 0) { showGameOver("Ты победил! 🎉", true); return true; }
            if (isPlayerTurn && getAllMoves('r').length === 0) { showGameOver("У тебя нет ходов! Ты проиграл.", false); return true; }
            if (!isPlayerTurn && getAllMoves('b').length === 0) { showGameOver("У бота нет ходов! Ты победил! 🎉", true); return true; }
            return false;
        }

        function showGameOver(text, isWin) {
            isGameOver = true; isPlayerTurn = false; clearHints(); gameOverText.innerText = text; gameOverText.style.color = isWin ? "#2ecc71" : "#ff4b2b"; gameOverScreen.style.display = 'flex';
            if (turnTimer) { clearInterval(turnTimer); turnTimer = null; }
        }

        helperCheckbox.addEventListener('change', () => { if (!isPlayerTurn || isGameOver) return; if (helperCheckbox.checked) showHint(); else { clearHints(); statusElement.innerText = "Твой ход!"; } });

        window.startGame = startGame; window.goToMenu = goToMenu; window.restartGame = startGame;
    </script>
