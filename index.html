<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Шашки Онлайн</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #0b0e14; color: #ffffff; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            min-height: 100vh; padding: 15px; overflow: hidden; 
        }
        
        /* --- МЕНЮ --- */
        #menu-screen { display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 10; width: 100%; }
        .menu-btn { padding: 15px 30px; font-size: 18px; font-weight: 700; border: none; border-radius: 12px; cursor: pointer; transition: transform 0.1s; width: 250px; color: white; }
        .menu-btn:active { transform: scale(0.95); }
        .btn-easy { background: linear-gradient(135deg, #00b09b, #96c93d); box-shadow: 0 4px 15px rgba(0, 176, 155, 0.3); }
        .btn-medium { background: linear-gradient(135deg, #f7971e, #ffd200); color: #1a1a1a; box-shadow: 0 4px 15px rgba(247, 151, 30, 0.3); }
        .btn-hard { background: linear-gradient(135deg, #ff007f, #ff4b2b); box-shadow: 0 4px 15px rgba(255, 0, 127, 0.3); }
        
        .helper-toggle { display: flex; align-items: center; gap: 10px; margin-top: 15px; cursor: pointer; background: rgba(255,255,255,0.05); padding: 10px 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); transition: 0.2s; }
        .helper-toggle:active { transform: scale(0.98); }
        .helper-toggle input { display: none; }
        .checkmark { width: 24px; height: 24px; border-radius: 6px; border: 2px solid #4facfe; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .helper-toggle input:checked ~ .checkmark { background: #4facfe; }
        .checkmark::after { content: "✔"; color: #fff; font-size: 16px; font-weight: bold; opacity: 0; transition: 0.2s; }
        .helper-toggle input:checked ~ .checkmark::after { opacity: 1; }
        .helper-label { font-size: 14px; font-weight: 600; color: #c9d1d9; }

        /* --- ИГРА --- */
        #game-screen { display: none; flex-direction: column; align-items: center; width: 100%; }
        
        /* Фиксированная высота шапки */
        .header { margin-bottom: 15px; text-align: center; height: 60px; display: flex; flex-direction: column; justify-content: flex-start; width: 100%; }
        .header h1 { font-size: 24px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 6px; background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #status { font-size: 13px; color: #6c7a89; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; line-height: 1.2; }

        #game-over-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 14, 20, 0.95); z-index: 100; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
        #game-over-text { font-size: 28px; font-weight: 800; text-align: center; margin-bottom: 20px; }
        .end-btn { padding: 15px 30px; font-size: 18px; font-weight: 700; border: none; border-radius: 12px; cursor: pointer; transition: transform 0.1s; width: 250px; color: white; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }
        .end-btn:active { transform: scale(0.95); }
        .end-btn.primary { background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); border: none; color: #0b0e14; }

        .board-container { 
            width: 100%; max-width: 360px; aspect-ratio: 1 / 1; 
            background: #0f131a; padding: 5px; border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6); 
            position: relative; 
            touch-action: none; /* Убираем скролл при кликах */
        }
        
        .board { 
            display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); 
            width: 100%; height: 100%; border-radius: 8px; overflow: hidden; 
            position: relative;
            pointer-events: none; /* Сетка не перехватывает клики */
        }
        .cell { width: 100%; height: 100%; position: relative; z-index: 1; pointer-events: auto; /* Клики только по пустым клеткам */ }
        
        .light { background-color: #1e2633; }
        .dark { background-color: #131821; }

        /* --- ШАШКИ --- */
        .piece { 
            width: 9.375%; height: 9.375%; 
            border-radius: 50%; 
            cursor: pointer; 
            position: absolute; 
            z-index: 5; 
            transition: top 0.3s cubic-bezier(0.4, 0, 0.2, 1), left 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.1s; 
            margin: 1.5625%; 
            pointer-events: auto; /* Шашка ловит клики */
        }
        
        .piece:active { transform: scale(0.9); }
        .red-piece { background: linear-gradient(135deg, #ff007f 0%, #ff4b2b 100%); box-shadow: 0 4px 10px rgba(255, 0, 127, 0.4); border: 1px solid rgba(255,255,255,0.2); }
        .black-piece { background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); box-shadow: 0 4px 10px rgba(0, 242, 254, 0.4); border: 1px solid rgba(255,255,255,0.2); }
        
        .king-piece { border: 3px solid #f1c40f !important; box-shadow: 0 0 15px #f1c40f !important; }
        .selected { border: 3px solid #ffffff !important; box-shadow: 0 0 10px #ffffff !important; transform: scale(1.1); z-index: 10;}
        .hint-piece { box-shadow: 0 0 15px #2ecc71, 0 0 25px #2ecc71 !important; border: 2px solid #2ecc71 !important; }

        .fade-out { animation: fadeOut 0.3s forwards; }
        @keyframes fadeOut { to { opacity: 0; transform: scale(0); } }

    </style>
</head>
<body>

    <div id="menu-screen">
        <h1 style="background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 28px; margin-bottom: 20px;">Выбери сложность</h1>
        <button class="menu-btn btn-easy" onclick="startGame('easy')">🟢 Легко</button>
        <button class="menu-btn btn-medium" onclick="startGame('medium')">🟡 Средне</button>
        <button class="menu-btn btn-hard" onclick="startGame('hard')">🔴 Сложно</button>
        
        <label class="helper-toggle">
            <input type="checkbox" id="helper-checkbox">
            <div class="checkmark"></div>
            <span class="helper-label">Включить помощника 🧠</span>
        </label>
    </div>

    <div id="game-screen">
        <div class="header">
            <h1 id="player-name">Шашки Арена 🏆</h1>
            <div id="status">Твой ход!</div>
        </div>
        <div class="board-container" id="board-container">
            <div class="board" id="game-board"></div>
        </div>
    </div>

    <div id="game-over-screen">
        <div id="game-over-text">Победа!</div>
        <button class="end-btn primary" onclick="restartGame()">🔄 Играть снова</button>
        <button class="end-btn" onclick="goToMenu()">🏠 Вернуться в меню</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); tg.ready();

        const boardElement = document.getElementById('game-board');
        const boardContainer = document.getElementById('board-container');
        const statusElement = document.getElementById('status');
        const nameElement = document.getElementById('player-name');
        const menuScreen = document.getElementById('menu-screen');
        const gameScreen = document.getElementById('game-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const gameOverText = document.getElementById('game-over-text');
        const helperCheckbox = document.getElementById('helper-checkbox');

        let selectedCell = null;
        let isPlayerTurn = true;
        let currentDifficulty = 'easy';
        let board = []; 
        let isGameOver = false;
        let piecesDOM = {}; 

        try {
            if (tg.initDataUnsafe?.user?.first_name) {
                nameElement.innerText = `${tg.initDataUnsafe.user.first_name} 👑`;
            }
        } catch (e) {}

        function startGame(difficulty) {
            currentDifficulty = difficulty;
            menuScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            gameScreen.style.display = 'flex';
            isGameOver = false;
            initBoard();
            isPlayerTurn = true;
            statusElement.innerText = "Твой ход! Нажми на красную шашку";
            showHint();
        }

        function goToMenu() {
            gameScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            menuScreen.style.display = 'flex';
            isGameOver = true;
        }

        function restartGame() {
            startGame(currentDifficulty);
        }

        // --- ИНИЦИАЛИЗАЦИЯ ---
        function initBoard() {
            boardElement.innerHTML = '';
            boardContainer.querySelectorAll('.piece').forEach(p => p.remove()); 
            
            board = Array(8).fill(null).map(() => Array(8).fill(null));
            piecesDOM = {};

            // Создаем сетку клеток
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const cell = document.createElement('div');
                    cell.className = `cell ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    // Клик по клетке (для пустых клеток)
                    cell.addEventListener('click', () => onCellClick(r, c));
                    boardElement.appendChild(cell);
                }
            }

            // Расстановка
            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 8; c++) {
                    if ((r + c) % 2 !== 0) board[r][c] = 'b';
                }
            }
            for (let r = 5; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if ((r + c) % 2 !== 0) board[r][c] = 'r';
                }
            }
            renderAllPieces();
        }

        function renderAllPieces() {
            boardContainer.querySelectorAll('.piece').forEach(p => p.remove());
            piecesDOM = {};

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (board[r][c]) {
                        createPieceDOM(r, c, board[r][c]);
                    }
                }
            }
        }

        function createPieceDOM(r, c, type) {
            const piece = document.createElement('div');
            const colorClass = (type.toLowerCase() === 'r') ? 'red-piece' : 'black-piece';
            piece.className = `piece ${colorClass}`;
            if (type === 'R' || type === 'B') piece.classList.add('king-piece');
            
            piece.style.top = `${r * 12.5}%`;
            piece.style.left = `${c * 12.5}%`;
            
            // Клик именно по шашке
            piece.addEventListener('click', (e) => {
                e.stopPropagation(); // Останавливаем всплытие, чтобы не сработал клик по клетке
                onCellClick(r, c);
            });

            boardContainer.appendChild(piece);
            piecesDOM[`${r}-${c}`] = piece;
        }

        function movePieceDOM(fromR, fromC, toR, toC) {
            const piece = piecesDOM[`${fromR}-${fromC}`];
            if (piece) {
                piece.style.top = `${toR * 12.5}%`;
                piece.style.left = `${toC * 12.5}%`;
                delete piecesDOM[`${fromR}-${fromC}`];
                piecesDOM[`${toR}-${toC}`] = piece;
            }
        }

        function removePieceDOM(r, c) {
            const piece = piecesDOM[`${r}-${c}`];
            if (piece) {
                piece.classList.add('fade-out');
                setTimeout(() => piece.remove(), 300);
                delete piecesDOM[`${r}-${c}`];
            }
        }

        function updatePiecesVisuals() {
            for (let key in piecesDOM) {
                const [r, c] = key.split('-').map(Number);
                const piece = piecesDOM[key];
                const type = board[r][c];
                if (!type) continue;

                if ((type === 'R' || type === 'B') && !piece.classList.contains('king-piece')) {
                    piece.classList.add('king-piece');
                }
                if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
                    piece.classList.add('selected');
                } else {
                    piece.classList.remove('selected');
                }
                if (piece.classList.contains('hint-piece')) piece.classList.remove('hint-piece');
            }
        }

        // --- ПОДСКАЗКИ ---
        function showHint() {
            if (!helperCheckbox.checked || !isPlayerTurn || isGameOver) return;
            
            let moves = getAllMoves('r');
            if (moves.length === 0) return;

            const bestMove = getBestMoveForPlayer(moves);
            const piece = piecesDOM[`${bestMove.fromRow}-${bestMove.fromCol}`];
            if (piece) piece.classList.add('hint-piece');
            
            if (bestMove.isCapture) {
                statusElement.innerText = "💡 Подсказка: Этой шашкой нужно срубить!";
            } else {
                statusElement.innerText = "💡 Подсказка: Рекомендую сходить этой шашкой.";
            }
        }

        function clearHints() {
            document.querySelectorAll('.hint-piece').forEach(el => el.classList.remove('hint-piece'));
        }

        // --- КЛИКИ ---
        function onCellClick(r, c) {
            if (!isPlayerTurn || isGameOver) return;

            // Если кликнули по своей шашке
            if (board[r][c] && board[r][c].toLowerCase() === 'r') {
                const captures = getAllMoves('r').filter(m => m.isCapture);
                if (captures.length > 0 && !captures.some(m => m.fromRow === r && m.fromCol === c)) {
                    statusElement.innerText = "Есть обязательное взятие! Выбери другую шашку.";
                    return;
                }

                // Отмена выбора
                if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
                    selectedCell = null;
                    updatePiecesVisuals();
                    statusElement.innerText = "Твой ход! Нажми на красную шашку";
                    showHint();
                    return;
                }

                selectedCell = { r, c };
                updatePiecesVisuals();
                statusElement.innerText = "Шашка выбрана! Выбери куда ходить.";
                return;
            }

            // Если кликнули по пустой клетке и шашка выбрана
            if (selectedCell && !board[r][c]) {
                const moves = getValidMovesForPiece(selectedCell.r, selectedCell.c);
                const targetMove = moves.find(m => m.toRow === r && m.toCol === c);

                if (targetMove) {
                    const allCaptures = getAllMoves('r').filter(m => m.isCapture);
                    if (allCaptures.length > 0 && !targetMove.isCapture) {
                        statusElement.innerText = "Ты должен рубить! Выбери другое действие.";
                        return;
                    }

                    clearHints();
                    executeMove(targetMove);
                    
                    const furtherCaptures = getValidMovesForPiece(r, c).filter(m => m.isCapture);
                    if (targetMove.isCapture && furtherCaptures.length > 0) {
                        selectedCell = { r, c };
                        updatePiecesVisuals();
                        statusElement.innerText = "Продолжай рубить этой же шашкой!";
                    } else {
                        selectedCell = null;
                        updatePiecesVisuals();
                        endTurn();
                    }
                } else {
                    selectedCell = null;
                    updatePiecesVisuals();
                    statusElement.innerText = "Так ходить нельзя. Выбери шашку снова.";
                    showHint();
                }
            }
        }

        // --- ЛОГИКА ---
        function getAllMoves(color) {
            let moves = [];
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (board[r][c] && board[r][c].toLowerCase() === color) {
                        moves = moves.concat(getValidMovesForPiece(r, c));
                    }
                }
            }
            return moves;
        }

        function getValidMovesForPiece(r, c) {
            const piece = board[r][c];
            const isKing = piece === piece.toUpperCase();
            const color = piece.toLowerCase();
            let moves = [];
            const dirs = [[-1,-1], [-1,1], [1,-1], [1,1]];
            for (let [dr, dc] of dirs) {
                if (isKing) {
                    let dist = 1;
                    let enemyFound = false;
                    let enemyR, enemyC;
                    while (true) {
                        let nr = r + dr * dist, nc = c + dc * dist;
                        if (nr < 0 || nr > 7 || nc < 0 || nc > 7) break;
                        if (board[nr][nc]) {
                            if (board[nr][nc].toLowerCase() === color) break;
                            if (enemyFound) break;
                            enemyFound = true;
                            enemyR = nr; enemyC = nc;
                        } else if (enemyFound) {
                            moves.push({ fromRow: r, fromCol: c, toRow: nr, toCol: nc, isCapture: true, capturedRow: enemyR, capturedCol: enemyC });
                        }
                        dist++;
                    }
                } else {
                    let nr = r + dr, nc = c + dc;
                    let tr = r + dr * 2, tc = c + dc * 2;
                    if (tr >= 0 && tr <= 7 && tc >= 0 && tc <= 7 && !board[tr][tc]) {
                        if (board[nr]?.[nc] && board[nr][nc].toLowerCase() !== color) {
                            moves.push({ fromRow: r, fromCol: c, toRow: tr, toCol: tc, isCapture: true, capturedRow: nr, capturedCol: nc });
                        }
                    }
                }
            }
            if (moves.length > 0) return moves;

            if (isKing) {
                for (let [dr, dc] of dirs) {
                    let dist = 1;
                    while (true) {
                        let nr = r + dr * dist, nc = c + dc * dist;
                        if (nr < 0 || nr > 7 || nc < 0 || nc > 7) break;
                        if (board[nr][nc]) break;
                        moves.push({ fromRow: r, fromCol: c, toRow: nr, toCol: nc, isCapture: false });
                        dist++;
                    }
                }
            } else {
                let dir = (color === 'r') ? -1 : 1;
                for (let dc of [-1, 1]) {
                    let nr = r + dir, nc = c + dc;
                    if (nr >= 0 && nr <= 7 && nc >= 0 && nc <= 7 && !board[nr][nc]) {
                        moves.push({ fromRow: r, fromCol: c, toRow: nr, toCol: nc, isCapture: false });
                    }
                }
            }
            return moves;
        }

        function executeMove(move) {
            let pieceType = board[move.fromRow][move.fromCol];
            
            if (move.isCapture) {
                board[move.capturedRow][move.capturedCol] = null;
                removePieceDOM(move.capturedRow, move.capturedCol);
            }
            
            board[move.fromRow][move.fromCol] = null;
            
            if (pieceType === 'r' && move.toRow === 0) pieceType = 'R';
            if (pieceType === 'b' && move.toRow === 7) pieceType = 'B';
            
            board[move.toRow][move.toCol] = pieceType;
            
            movePieceDOM(move.fromRow, move.fromCol, move.toRow, move.toCol);
            updatePiecesVisuals();
        }

        function endTurn() {
            if (checkGameOver()) return;
            isPlayerTurn = false;
            clearHints();
            statusElement.innerText = "Ход бота... 🤖";
            setTimeout(botMove, 400);
        }

        // --- БОТ ---
        function botMove() {
            if (checkGameOver()) return;
            let allMoves = getAllMoves('b');
            let captureMoves = allMoves.filter(m => m.isCapture);
            let validMoves = captureMoves.length > 0 ? captureMoves : allMoves;

            if (validMoves.length === 0) {
                statusElement.innerText = "Боту некуда ходить! Ты победил! 🎉";
                isPlayerTurn = true;
                return;
            }

            let chosenMove;
            if (currentDifficulty === 'easy') {
                chosenMove = validMoves[Math.floor(Math.random() * validMoves.length)];
            } else if (currentDifficulty === 'medium') {
                if (captureMoves.length > 0) chosenMove = captureMoves[Math.floor(Math.random() * captureMoves.length)];
                else {
                    validMoves.sort((a, b) => b.toRow - a.toRow);
                    chosenMove = validMoves[0];
                }
            } else {
                chosenMove = getBestMoveForBot(validMoves);
            }

            executeMove(chosenMove);
            
            if (checkGameOver()) return;
            
            isPlayerTurn = true;
            statusElement.innerText = "Твой ход! Нажми на красную шашку";
            showHint();
        }

        function getBestMoveForBot(moves) {
            let bestMove = moves[0];
            let bestScore = -Infinity;
            for (let move of moves) {
                let score = 0;
                if (move.isCapture) score += 100;
                if (move.toRow === 7) score += 50;
                
                let tempPiece = board[move.fromRow][move.fromCol];
                board[move.fromRow][move.fromCol] = null;
                if (move.isCapture) board[move.capturedRow][move.capturedCol] = null;
                board[move.toRow][move.toCol] = tempPiece;

                let isVulnerable = false;
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        if (board[r][c] && board[r][c].toLowerCase() === 'r') {
                            let redMoves = getValidMovesForPiece(r, c);
                            if (redMoves.some(m => m.isCapture && m.capturedRow === move.toRow && m.capturedCol === move.toCol)) {
                                isVulnerable = true; break;
                            }
                        }
                    }
                    if (isVulnerable) break;
                }
                
                board[move.toRow][move.toCol] = null;
                if (move.isCapture) board[move.capturedRow][move.capturedCol] = tempPiece === 'b' ? 'r' : 'R';
                board[move.fromRow][move.fromCol] = tempPiece;

                if (isVulnerable) score -= 80;
                score -= Math.abs(3.5 - move.toCol) * 2;
                
                if (score > bestScore) {
                    bestScore = score;
                    bestMove = move;
                }
            }
            return bestMove;
        }

        function getBestMoveForPlayer(moves) {
            let bestMove = moves[0];
            let bestScore = -Infinity;
            for (let move of moves) {
                let score = 0;
                if (move.isCapture) score += 100;
                if (move.toRow === 0) score += 50;
                
                let tempPiece = board[move.fromRow][move.fromCol];
                board[move.fromRow][move.fromCol] = null;
                if (move.isCapture) board[move.capturedRow][move.capturedCol] = null;
                board[move.toRow][move.toCol] = tempPiece;

                let isVulnerable = false;
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        if (board[r][c] && board[r][c].toLowerCase() === 'b') {
                            let botMoves = getValidMovesForPiece(r, c);
                            if (botMoves.some(m => m.isCapture && m.capturedRow === move.toRow && m.capturedCol === move.toCol)) {
                                isVulnerable = true; break;
                            }
                        }
                    }
                    if (isVulnerable) break;
                }
                
                board[move.toRow][move.toCol] = null;
                if (move.isCapture) board[move.capturedRow][move.capturedCol] = tempPiece === 'r' ? 'b' : 'B';
                board[move.fromRow][move.fromCol] = tempPiece;

                if (isVulnerable) score -= 80;
                score -= Math.abs(3.5 - move.toCol) * 2;
                
                if (score > bestScore) {
                    bestScore = score;
                    bestMove = move;
                }
            }
            return bestMove;
        }

        function checkGameOver() {
            if (isGameOver) return true;
            const reds = board.flat().filter(p => p && p.toLowerCase() === 'r').length;
            const blacks = board.flat().filter(p => p && p.toLowerCase() === 'b').length;
            
            if (reds === 0) { showGameOver("Ты проиграл! 🤖", false); return true; }
            if (blacks === 0) { showGameOver("Ты победил! 🎉", true); return true; }
            if (isPlayerTurn && getAllMoves('r').length === 0) { showGameOver("У тебя нет ходов! Ты проиграл.", false); return true; }
            if (!isPlayerTurn && getAllMoves('b').length === 0) { showGameOver("У бота нет ходов! Ты победил! 🎉", true); return true; }
            return false;
        }

        function showGameOver(text, isWin) {
            isGameOver = true;
            isPlayerTurn = false;
            clearHints();
            gameOverText.innerText = text;
            gameOverText.style.color = isWin ? "#2ecc71" : "#ff4b2b";
            gameOverScreen.style.display = 'flex';
        }

        helperCheckbox.addEventListener('change', () => {
            if (!isPlayerTurn || isGameOver) return;
            if (helperCheckbox.checked) {
                showHint();
            } else {
                clearHints();
                statusElement.innerText = "Твой ход! Нажми на красную шашку";
            }
        });

        window.startGame = startGame;
        window.goToMenu = goToMenu;
        window.restartGame = restartGame;
    </script>
</body>
</html>
